# Noctalia v5 shared appearance. Machine paths and dock apps are generated by install.sh.
[shell]
font_family = "sans-serif"
time_format = "{:%I:%M %p}"
date_format = "%m-%d"
corner_radius_scale = 1.5

[bar.main]
margin_ends = 0
margin_edge = 0
radius = 0
thickness = 34
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = ["tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[widget.clock]
format = "{:%I:%M %p}"
tooltip_format = "%m-%d"

# install.sh supplies the XDG Pictures/wallpaper directory and bundled image.
[wallpaper]
directory = ""

[dock]
enabled = true
show_running = true
pinned = []
