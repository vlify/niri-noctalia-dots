# Noctalia 配置 — 由 Hermes 试跑生成
# 文档: https://noctalia.dev  (默认配置见 example.toml)

[shell]
# 时钟/日期格式：默认 %A, %x 在中文下过长
time_format = "{:%I:%M %p}"
date_format = "%m-%d"
font_family = "JetBrainsMono Nerd Font Propo"

# 圆角：0 = 直角, 1 = 默认, 2 = 更圆（与 niri 16px 窗口圆角协调）
corner_radius_scale = 1.5

[bar.main]
# 通栏贴顶：两端留白清零，铺满全屏上端，直角贴合
margin_ends = 0
margin_edge = 0
radius = 0
thickness = 34

# 中岛保持只有时钟；媒体标题移到 end 区避免挤压
start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
# media 从 end 移除：它的标题会紧贴中岛时钟导致文字挤压
end    = ["tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[wallpaper]
directory = "/home/ent/Pictures/Waypaper"

[widget.clock]
format = "%I:%M %p"

